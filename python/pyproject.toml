[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adbc-driver-redis"
version = "0.1.0"
description = "Redis ADBC driver and analytics integrations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["adbc-driver-manager>=1.12.0"]

[project.urls]
Homepage = "https://github.com/redis/redis-adbc-driver"
Documentation = "https://github.com/redis/redis-adbc-driver/blob/main/docs/python-integrations.md"
Issues = "https://github.com/redis/redis-adbc-driver/issues"

[project.optional-dependencies]
dbapi = ["pyarrow>=26.0.0"]
sqlalchemy = ["sqlalchemy>=2.1.6", "pyarrow>=26.0.0"]
superset = ["apache-superset>=6.1.0", "sqlalchemy>=1.4.54,<2", "pyarrow>=18.1.0,<19", "flask-caching==2.3.1", "cachetools>=7.2.4"]
dagster = ["dagster>=1.13.26", "pyarrow>=26.0.0"]
dask = ["dask[dataframe,distributed]>=2026.8.0", "pandas>=3.1.0", "pyarrow>=26.0.0"]
prefect = ["prefect>=3.9.0,<4", "pyarrow>=26.0.0"]
test = ["prefect>=3.9.0,<4", "pytest>=9.1.1", "pyarrow>=26.0.0", "sqlalchemy>=2.1.6", "dagster>=1.13.26", "dagster-adbc>=0.0.2", "pandas>=3.1.0", "polars>=2.0.0", "duckdb==2.0.0", "dask[dataframe,distributed]>=2026.8.0"]

[project.entry-points."sqlalchemy.dialects"]
"redis.adbc" = "adbc_driver_redis.sqlalchemy:RedisDialect"
"rediss.adbc" = "adbc_driver_redis.sqlalchemy:RedisDialect"

[project.entry-points."superset.db_engine_specs"]
redis = "adbc_driver_redis.superset:RedisEngineSpec"
rediss = "adbc_driver_redis.superset:RedisTLSEngineSpec"

[tool.setuptools.packages.find]
include = ["adbc_driver_redis*", "adbc_driver_rediss*"]

[tool.setuptools.package-data]
adbc_driver_redis = ["*.so", "*.dylib", "*.dll"]
