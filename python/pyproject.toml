[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adbc-driver-redis"
version = "0.1.0"
description = "Redis ADBC driver and Python bindings"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["adbc-driver-manager>=1.13.0"]

[project.urls]
Homepage = "https://github.com/redis/redis-adbc-driver"
Documentation = "https://github.com/redis/redis-adbc-driver/blob/main/docs/python-integrations.md"
Issues = "https://github.com/redis/redis-adbc-driver/issues"

[project.optional-dependencies]
dbapi = ["pyarrow>=26.0.1"]
pandas = ["pyarrow>=26.0.1", "pandas>=3.1.1"]
polars = ["pyarrow>=26.0.1", "polars>=2.1.0"]
sqlalchemy = ["sqlalchemy>=2.1.9", "pyarrow>=26.0.1"]
test = ["pytest>=9.2.0", "pyarrow>=26.0.1", "sqlalchemy>=2.1.9", "pandas>=3.1.1", "polars>=2.1.0", "duckdb==2.0.0"]
candidate-tests = ["scikit-learn>=1.5"]
workflow-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "pandas>=3.1.1", "nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "datasets>=3", "streamlit>=1.40", "scipy>=1.15"]
plotting-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "pandas>=3.1.1", "plotly>=6", "matplotlib>=3.10"]
model-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "scikit-learn>=1.5", "xgboost>=3", "torch>=2.6", "tensorflow>=2.19", "transformers>=4.50", "keras>=3"]
orchestrator-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "duckdb>=2", "kfp>=2.10", "metaflow>=2.14", "fivetran-connector-sdk>=2"]
spark-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "pandas>=3.1.1", "pyspark>=4"]
test-runner = ["pytest>=9.2.0"]
dbt-tests = ["pytest>=9.2.0", "pyarrow>=26.0.1", "dbt-core>=1.10,<2"]
analysis-tests = ["pytest>=9.2.0", "pyarrow>=18,<26", "pandas>=2.3,<4", "ibis-framework[duckdb]>=12", "mlflow>=3.18.0,<4"]
beam-tests = ["pytest>=9.2.0", "apache-beam>=2.77,<3"]
mage-tests = ["pytest>=9.2.0", "mage-ai==0.9.80"]
kestra-tests = ["pytest>=9.2.0", "pyarrow>=26", "requests>=2.32", "pyyaml>=6", "kestra==2.0.0"]

[project.entry-points."sqlalchemy.dialects"]
"redis.adbc" = "adbc_driver_redis.sqlalchemy:RedisDialect"
"rediss.adbc" = "adbc_driver_redis.sqlalchemy:RedisDialect"

[tool.setuptools.packages.find]
include = ["adbc_driver_redis*", "adbc_driver_rediss*"]

[tool.setuptools.package-data]
adbc_driver_redis = ["*.so", "*.dylib", "*.dll"]
