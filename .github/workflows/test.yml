# Runs the Go tests and the validation suite on Linux amd64 and arm64 against
# Redis Software and an OSS 3-shard compatibility cluster, as release.yml's linux job does.
# Results can differ between the two (Go fuses multiply-adds on arm64 but not
# amd64, and an amd64 server writes some NaNs as -nan), so both are tested
# before merge rather than first in the release run, whose failure leaves the
# release with no binaries. Only the other Linux distributions are left to
# release.yml.
#
# Runs on pull requests that change the driver or this file. A newer push to
# the same pull request cancels the run in progress.
name: Test

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - go/**
      - benchmarks/clickbench/**
      - benchmarks/qpf/**
      - benchmarks/workers/**

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check ClickBench loading helpers
        run: |
          uv run --no-project --with pyarrow --with redis --with adbc-driver-manager --with duckdb \
            python -m unittest discover -s benchmarks/clickbench -v

      - name: Check performance benchmark syntax
        run: python3 -m py_compile benchmarks/qpf/*.py benchmarks/workers/*.py

      # The validation suite loads go/build/libadbc_driver_redis.so.
      - name: Build
        working-directory: go
        run: make build

      - name: Start Redis Software
        working-directory: go
        run: make redis-up

      # -p 1: the packages' integration tests share the server, and a
      # connection opened by one rolls back the abandoned moves another set
      # up (see the Makefile's test target).
      - name: Test (Redis Software)
        working-directory: go
        env:
          REDIS_URI: redis://localhost:6379/0
        run: |
          go test -count=1 -p 1 ./...
          cd validation && uv run pytest -q tests/

      - name: Start OSS compatibility cluster
        working-directory: go
        run: |
          make redis-down
          docker compose --profile cluster up --detach --wait redis-cluster

      - name: Test (OSS 3-shard compatibility)
        working-directory: go
        env:
          REDIS_URI: redis://localhost:7001/0
        run: |
          go test -count=1 -p 1 ./...
          cd validation && uv run pytest -q tests/
