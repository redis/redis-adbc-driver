name: Multi-shard coordination model

on:
  pull_request:
    paths:
      - .github/workflows/multishard-model.yml
      - scripts/multishard_model/**
      - docs/sdlc/changes/issue-568-multishard/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Explore publication and reclamation interleavings
        run: python -m unittest discover -s scripts/multishard_model -p 'test_*.py' -v
