name: DuckDB extension

on:
  pull_request:
    paths:
      - .github/workflows/duckdb-extension.yml
      - CMakeLists.txt
      - Makefile
      - extension_config.cmake
      - duckdb-extension/**
      - test/sql/**
      - go/**
      - duckdb
      - extension-ci-tools
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckdb-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake ninja
      - name: Check the community registry's DuckDB 2.0 API
        run: |
          git init build/registry-source
          git -C build/registry-source fetch --depth 1 https://github.com/duckdb/duckdb.git d54cbbe3df17e8e5ce68312f483b4155836112aa
          git -C build/registry-source checkout FETCH_HEAD
          cmake -S build/registry-source -B build/registry -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOVERRIDE_GIT_DESCRIBE=v2.0.0 \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/extension_config.cmake" \
            -DBUILD_UNITTESTS=OFF -DBUILD_SHELL=OFF -DEXTENSION_STATIC_BUILD=OFF
          cmake --build build/registry --target redis_adbc_loadable_extension -j 2
  native:
    env:
      DUCKDB_TEST_VERSION: '1.5.6'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cmake ninja "duckdb==$DUCKDB_TEST_VERSION" pytest pyarrow adbc-driver-manager
      - name: Build distributable extension and SQLLogicTest runner
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        # Shallow submodule checkouts may lack tags, making DuckDB fall back to
        # v0.0.1. Stamp the same ABI version as the Python package tested below.
        run: OVERRIDE_GIT_DESCRIBE="v$DUCKDB_TEST_VERSION" GEN=ninja make release
      - name: Offline SQLLogicTests
        env:
          LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/release/repository
          DUCKDB_TEST_ON_INIT: SET extension_directory='${{ runner.temp }}/redis-adbc-duckdb-extensions'
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/duckdb-sql-tests.log"
          python -c 'import pathlib, sys; log = pathlib.Path(sys.argv[1]).read_text(); assert "All tests passed" in log, "SQLLogicTests did not pass; check for skipped extension loading"' "$RUNNER_TEMP/duckdb-sql-tests.log"
      - name: Start disposable Redis with Search
        if: runner.os == 'Linux'
        run: |
          docker run -d --rm --name redis-duckdb-test -p 127.0.0.1:16389:6379 redis:8.6.2
          for attempt in $(seq 1 30); do
            if docker exec redis-duckdb-test redis-cli ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build fixture driver and run real Redis tests
        if: runner.os == 'Linux'
        env:
          REDIS_URI: redis://localhost:16389/0
          REDIS_ADBC_EXTENSION: ${{ github.workspace }}/build/release/extension/redis_adbc/redis_adbc.duckdb_extension
          REDIS_ADBC_LIBRARY: ${{ github.workspace }}/go/build/libadbc_driver_redis.so
          REDIS_DUCKDB_CLI: ${{ github.workspace }}/build/release/duckdb
        run: |
          make -C go build
          python -m pytest -q duckdb-extension/test
          python duckdb-extension/verify_cli.py
      - name: Stop test Redis
        if: always() && runner.os == 'Linux'
        run: docker stop redis-duckdb-test || true
