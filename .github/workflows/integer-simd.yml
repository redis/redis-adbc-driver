name: Integer SIMD experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - go/internal/intpredicate/**
      - go/integer_simd_profile_test.go
      - .github/workflows/integer-simd.yml
permissions:
  contents: read
jobs:
  kernels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            backend: sse4.2
          - runner: ubuntu-24.04-arm
            backend: neon
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Record public synthetic benchmark environment
        run: |
          mkdir -p ../simd-results
          git rev-parse HEAD > ../simd-results/source.txt
          go version > ../simd-results/toolchain.txt
          lscpu > ../simd-results/cpu.txt
      - name: Native parity and portable fallback
        run: |
          INTEGER_SIMD_EXPECT=${{ matrix.backend }} go test -count=1 -v ./internal/intpredicate
          CGO_ENABLED=0 go test -count=1 -v ./internal/intpredicate
          go test -tags purego -count=1 ./internal/intpredicate
          go test -race -count=1 ./internal/intpredicate
      - name: Verify missing SSE4.2 falls back without executing native instructions
        if: runner.arch == 'X64'
        run: GODEBUG=cpu.sse42=off INTEGER_SIMD_EXPECT=scalar go test -count=1 ./internal/intpredicate
      - name: Measure kernels and full conversion
        run: |
          go test -run '^$' -bench BenchmarkMatch -benchmem -benchtime=50ms -count=3 ./internal/intpredicate > ../simd-results/kernels.txt
          go test -run '^$' -bench BenchmarkIntegerBatchConversion -benchmem -benchtime=50ms -count=3 . > ../simd-results/conversion.txt
      - uses: actions/upload-artifact@v6
        with:
          name: integer-simd-${{ runner.arch }}
          path: simd-results
