name: Publish Python wheels to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose native wheels will be published
        required: true
        type: string

      description_revision:
        description: 'Optional metadata-only post-release revision (e.g. 1 for .post1)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/adbc-driver-redis/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download release wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > release.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl*' --dir downloads
      - name: Verify exact platform set, checksums, version, and native libraries
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import email, hashlib, json, os, pathlib, re, shutil, zipfile
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Expected a stable vMAJOR.MINOR.PATCH release tag')
          release = json.loads(pathlib.Path('release.json').read_text())
          assert release['tagName'] == tag and not release['isDraft'] and not release['isPrerelease']
          version = tag[1:]
          platforms = {'manylinux_2_28_x86_64', 'manylinux_2_28_aarch64', 'macosx_12_0_arm64'}
          expected = {f'adbc_driver_redis-{version}-py3-none-{p}.whl' for p in platforms}
          root = pathlib.Path('downloads')
          assert {p.name for p in root.glob('*.whl')} == expected, 'Missing or unexpected wheel'
          assets = {a['name']: a for a in release['assets']}
          pathlib.Path('dist').mkdir(exist_ok=True)
          for name in sorted(expected):
              wheel = root / name
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              checksum = (root / (name + '.sha256')).read_text().split()[0]
              assert digest == checksum, f'Checksum mismatch: {name}'
              api_digest = assets[name].get('digest')
              if api_digest:
                  assert api_digest == 'sha256:' + digest, f'GitHub digest mismatch: {name}'
              with zipfile.ZipFile(wheel) as z:
                  assert z.testzip() is None
                  metadata_path, = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
                  metadata = email.message_from_bytes(z.read(metadata_path))
                  assert metadata['Name'] == 'adbc-driver-redis' and metadata['Version'] == version
                  assert 'sqlalchemy' in metadata.get_all('Provides-Extra', [])
                  assert any(n.endswith('/adbc_driver_redis/libadbc_driver_redis.so') or n == 'adbc_driver_redis/libadbc_driver_redis.so' for n in z.namelist())
                  assert any(n.endswith('adbc_driver_redis/superset.py') for n in z.namelist())
                  assert any(n.endswith('adbc_driver_redis/sqlalchemy.py') for n in z.namelist())
              shutil.copy2(wheel, pathlib.Path('dist') / name)
              print(name, digest)
          PY
      - uses: actions/checkout@v7
        if: inputs.description_revision != ''
        with:
          sparse-checkout: |
            python/README.md
            python/pyproject.toml
            scripts/repackage_python_description.py
          sparse-checkout-cone-mode: false
          path: description-source
      - name: Prepare metadata-only description post-release
        if: inputs.description_revision != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DESCRIPTION_REVISION: ${{ inputs.description_revision }}
        run: |
          python description-source/scripts/repackage_python_description.py \
            --version "${RELEASE_TAG#v}" --revision "$DESCRIPTION_REVISION" \
            --package description-source/python --dist dist
      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true
