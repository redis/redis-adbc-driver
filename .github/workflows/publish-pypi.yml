name: Publish Python wheels to PyPI

on:
  workflow_run:
    workflows: [Release binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose native wheels will be published
        required: true
        type: string

      description_revision:
        description: 'Optional metadata-only post-release revision (e.g. 1 for .post1)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve validated release (never consume PR artifacts)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir metadata
            tag=$(python3 - <<'PY'
          import json, pathlib, re
          release = json.loads(pathlib.Path('metadata/release-metadata.json').read_text())
          tag = release['tag']
          if release['skip'] or release['isDraft'] or release['isPrerelease'] or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              print('')  # Prereleases and historical test-skip rebuilds do not auto-publish.
          else:
              print(tag)
          PY
            )
          fi
          if [ -n "$tag" ]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/adbc-driver-redis/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download release wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > release.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl*' --dir downloads
      - name: Verify exact platform set, checksums, version, and native libraries
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python scripts/verify_release_wheels.py --tag "$RELEASE_TAG"
      - uses: actions/checkout@v7
        if: inputs.description_revision != ''
        with:
          sparse-checkout: |
            python/README.md
            python/pyproject.toml
            scripts/repackage_python_description.py
          sparse-checkout-cone-mode: false
          path: description-source
      - name: Prepare metadata-only description post-release
        if: inputs.description_revision != ''
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESCRIPTION_REVISION: ${{ inputs.description_revision }}
        run: |
          python description-source/scripts/repackage_python_description.py \
            --version "${RELEASE_TAG#v}" --revision "$DESCRIPTION_REVISION" \
            --package description-source/python --dist dist
      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true
