# Builds the driver library and the redis-adbc command for Linux (amd64,
# arm64) and macOS (arm64), tests the Linux builds against Redis Software
# and an OSS compatibility cluster, runs the validation suite and a redis-adbc check,
# copy and adopt on each Linux tarball on every distribution Redis Software
# supports, and attaches the tarballs to the release.
#
# The redis-adbc steps are skipped for releases tagged before it existed (no
# go/cmd/redis-adbc). Releases up to v0.0.11 also had a redis-arrow command;
# this workflow no longer builds it.
#
# Runs when a release is published, or by hand for an existing release tag
# (its assets are replaced). A run by hand can skip Go tests that are wrong at
# that tag (skip, a go test -skip pattern). Builds platform Python wheels when
# the selected ref includes python/, installs native driver manifests on request
# via the tarball installer, and attaches wheels alongside the tarballs.
# Pull requests that change this
# file run the builds and tests without uploading anything.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (its assets are replaced)
        required: true
      skip:
        description: Go tests to skip (a go test -skip pattern), for a tag whose own test is known to be wrong
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - go/build-linux.sh
      - go/compose.yaml
      - go/cluster-ready.sh
      - python/**
      - scripts/build_python_wheel.py
      - scripts/install*
      - scripts/test_cluster_ready.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}

env:
  # The version stamped into the library and used in asset names.
  VERSION: ${{ github.event.release.tag_name || inputs.tag || 'v0.0.0-dev' }}
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
  # Go tests to skip; empty (every run but one by hand with skip) skips none.
  SKIP: ${{ inputs.skip }}

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      # The build script comes from the workflow's own commit, so releases
      # tagged before it existed (rebuilt by hand) are built the same way.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: go/build-linux.sh
          sparse-checkout-cone-mode: false

      - name: Check cluster readiness gate
        if: hashFiles('scripts/test_cluster_ready.py') != ''
        run: python3 -m unittest discover -s scripts -p test_cluster_ready.py -v

      # Built on AlmaLinux 8 against glibc 2.28 (checked), so the library
      # loads on RHEL 8 and 9, Ubuntu 20.04 and later, and Amazon Linux 2023.
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cp .workflow/go/build-linux.sh go/build-linux.sh
          ./go/build-linux.sh "$ARCH" "$VERSION"
          cp "go/build/linux-$ARCH"/* go/build/

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v10.2.0

      # redis-adbc needs no cgo, so it is statically linked and runs on any
      # Linux of its architecture.
      - name: Build redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        working-directory: go
        run: |
          make adbc-cli VERSION="$VERSION"
          file build/redis-adbc
          file build/redis-adbc | grep -q 'statically linked'

      - name: Build Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          platform=manylinux_2_28_x86_64
          if [ "$ARCH" = arm64 ]; then platform=manylinux_2_28_aarch64; fi
          uv run --no-project --with build --with setuptools --with wheel --with packaging python scripts/build_python_wheel.py \
            --library go/build/libadbc_driver_redis.so --platform "$platform" --version "$VERSION" --out dist
          for wheel in dist/*.whl; do sha256sum "$wheel" > "$wheel.sha256"; done

      - name: Start Redis Software
        working-directory: go
        run: make redis-up

      # -p 1: the packages' integration tests share the server, and a
      # connection opened by one rolls back the abandoned moves another set
      # up (see the Makefile's test target).
      - name: Test (Redis Software)
        working-directory: go
        env:
          REDIS_URI: redis://localhost:6379/0
        run: |
          go test -count=1 -p 1 -skip "$SKIP" ./...
          cd validation && uv run pytest -q tests/

      - name: Smoke test installed Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        env:
          REDIS_URI: redis://localhost:6379/0
        run: |
          uv venv --python 3.12 /tmp/redis-wheel-smoke
          uv pip install --python /tmp/redis-wheel-smoke/bin/python dist/*.whl pyarrow polars pytest
          /tmp/redis-wheel-smoke/bin/python -m pytest -q python/tests/test_driver.py

      - name: Start OSS compatibility cluster
        working-directory: go
        run: |
          make redis-down
          docker compose --profile cluster up --detach --wait redis-cluster

      - name: Test (OSS 3-shard compatibility)
        working-directory: go
        env:
          REDIS_URI: redis://localhost:7001/0
        run: |
          go test -count=1 -p 1 -skip "$SKIP" ./...
          cd validation && uv run pytest -q tests/

      - name: Redis diagnostics on failure
        if: failure()
        working-directory: go
        run: |
          docker compose --profile cluster ps -a
          docker compose --profile cluster logs --no-color
          if docker compose --profile cluster ps --status running --services | grep -qx redis-cluster; then
            for port in 7001 7002 7003; do
              docker compose exec -T redis-cluster redis-cli -p "$port" CLUSTER INFO || true
              docker compose exec -T redis-cluster redis-cli -p "$port" CLUSTER NODES || true
              docker compose exec -T redis-cluster redis-cli -e -p "$port" FT._LIST || true
            done
          fi

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="adbc_driver_redis-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          cp go/build/libadbc_driver_redis.so go/build/libadbc_driver_redis.h README.md "dist/$name/"
          if [ -f scripts/install.sh ]; then
            cp scripts/install.sh scripts/install_manifest.py python/adbc_driver_redis/manifest.py "dist/$name/"
            printf '%s\n' "$VERSION" > "dist/$name/VERSION"
          fi
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - name: Package redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="redis-adbc-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          cp go/build/redis-adbc README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # The release tarball, tested on each Linux that Redis Software supports
  # (the linux job above already ran it on the Ubuntu 24.04 runner).
  platforms:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["ubuntu:20.04", "ubuntu:22.04", "almalinux:8", "almalinux:9", "amazonlinux:2023"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Start Redis Software
        working-directory: go
        run: make redis-up

      - name: Validation suite
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar xzf "dist/adbc_driver_redis-$VERSION-linux-$ARCH.tar.gz" -C dist
          docker run --rm --network host \
            -v "$PWD/go/validation:/src/validation:ro" \
            -v "$PWD/dist/adbc_driver_redis-$VERSION-linux-$ARCH:/lib-in:ro" \
            -v "$(dirname "$(command -v uv)"):/uv:ro" \
            -e REDIS_URI=redis://localhost:6379/0 "$IMAGE" sh -euc '
              if command -v apt-get >/dev/null; then
                apt-get -qq update
                DEBIAN_FRONTEND=noninteractive apt-get -qq install -y git ca-certificates >/dev/null
              else
                dnf -q -y install git >/dev/null
              fi
              grep PRETTY_NAME /etc/os-release
              ldd --version | head -1
              mkdir -p /work/go/build
              cp -r /src/validation /work/go/
              cp /lib-in/libadbc_driver_redis.so /work/go/build/
              cd /work/go/validation
              /uv/uv run -q pytest -q tests/'

      # The redis-adbc tarball: an application's HASHes (written with the
      # server's redis-cli), checked, copied into a table, and adopted.
      - name: redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="redis-adbc-$VERSION-linux-$ARCH"
          tar xzf "dist/$name.tar.gz" -C dist
          (cd go && docker compose exec -T redis-software /opt/redislabs/bin/redis-cli -p 12000 HSET release:adbc:1 name a n 1 >/dev/null &&
            docker compose exec -T redis-software /opt/redislabs/bin/redis-cli -p 12000 HSET release:adbc:2 name b n 2 >/dev/null)
          docker run --rm --network host \
            -v "$PWD/dist/$name:/cli:ro" \
            -e REDIS_URI=redis://localhost:6379/0 "$IMAGE" sh -euc '
              cd /tmp
              /cli/redis-adbc check -prefix release:adbc: > out
              grep -qx "SQL, copied into a driver table (redis-adbc copy): READY" out
              grep -qx "SQL, adopted in place (redis-adbc adopt): READY" out
              /cli/redis-adbc copy -prefix release:adbc: -table release_adbc_copy -mode replace > out
              grep -qx "2 rows copied into public.release_adbc_copy" out
              /cli/redis-adbc adopt -prefix release:adbc: -table release_adbc -apply > out
              grep -q "^Adopted: public.release_adbc now reads the HASHes under release:adbc:" out'

  # GitHub's macOS runners can't run the Redis containers, so the macOS
  # library is built and checked to load; the Go unit tests run without a
  # server (integration tests skip).
  macos:
    name: darwin-arm64
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        working-directory: go
        run: make build VERSION="$VERSION"

      - name: Build and load Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        run: |
          uv run --no-project --with build --with setuptools --with wheel --with packaging python scripts/build_python_wheel.py \
            --library go/build/libadbc_driver_redis.dylib --platform macosx_12_0_arm64 --version "$VERSION" --out dist
          for wheel in dist/*.whl; do shasum -a 256 "$wheel" > "$wheel.sha256"; done
          uv venv --python 3.12 /tmp/redis-wheel-smoke
          uv pip install --python /tmp/redis-wheel-smoke/bin/python dist/*.whl
          /tmp/redis-wheel-smoke/bin/python -c "import ctypes; from adbc_driver_redis import _driver_path; ctypes.CDLL(_driver_path()).AdbcDriverInit"

      - name: Build redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        working-directory: go
        run: |
          make adbc-cli VERSION="$VERSION"
          file build/redis-adbc | grep -q arm64
          build/redis-adbc help | grep -q adopt

      - name: Test
        working-directory: go
        run: |
          go test -count=1 -skip "$SKIP" ./...
          file build/libadbc_driver_redis.dylib | grep -q arm64
          python3 -c "import ctypes; ctypes.CDLL('build/libadbc_driver_redis.dylib').AdbcDriverInit"

      - name: Package
        run: |
          name="adbc_driver_redis-$VERSION-darwin-arm64"
          mkdir -p "dist/$name"
          cp go/build/libadbc_driver_redis.dylib go/build/libadbc_driver_redis.h README.md "dist/$name/"
          if [ -f scripts/install.sh ]; then
            cp scripts/install.sh scripts/install_manifest.py python/adbc_driver_redis/manifest.py "dist/$name/"
            printf '%s\n' "$VERSION" > "dist/$name/VERSION"
          fi
          cd dist
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - name: Package redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        run: |
          name="redis-adbc-$VERSION-darwin-arm64"
          mkdir -p "dist/$name"
          cp go/build/redis-adbc README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: dist/

  upload:
    if: github.event_name != 'pull_request'
    needs: [linux, platforms, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    name: Publish Python wheels to PyPI
    if: github.event_name != 'pull_request'
    needs: upload
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/adbc-driver-redis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Select Python wheels
        id: wheels
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(release-assets/adbc_driver_redis-*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo 'No Python wheels in this historical release; skipping PyPI.'
            exit 0
          fi
          mkdir dist
          cp "${wheels[@]}" dist/
          echo 'present=true' >> "$GITHUB_OUTPUT"
      - name: Publish with PyPI Trusted Publishing
        if: steps.wheels.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
