# Builds the driver library and the redis-adbc command for Linux (amd64,
# arm64) and macOS (arm64), tests the Linux builds against Redis Software
# with TLS and authentication, runs validation and a redis-adbc check,
# copy and adopt on each Linux tarball on every distribution Redis Software
# supports, and attaches the tarballs to the release.
#
# The redis-adbc steps are skipped for releases tagged before it existed (no
# go/cmd/redis-adbc). Releases up to v0.0.11 also had a redis-arrow command;
# this workflow no longer builds it.
#
# Runs when a release is published, or by hand for an existing release tag
# (its assets are replaced). A run by hand can skip Go tests that are wrong at
# that tag (skip, a go test -skip pattern). Builds platform Python wheels when
# the selected ref includes python/, installs native driver manifests on request
# via the tarball installer, and attaches wheels alongside the tarballs.
# Pull requests affecting packaging or partition compatibility run the builds
# and tests without publishing release assets.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (its assets are replaced)
        required: true
      skip:
        description: Go tests to skip (a go test -skip pattern), for a tag whose own test is known to be wrong
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - go/build-linux.sh
      - go/Dockerfile.linux-builder
      - go/compose.yaml
      - go/cluster-ready.sh
      - go/software-*.sh
      - scripts/test_software_bootstrap_http.py
      - scripts/build_native_redis_fixture.sh
      - go/*partition*.go
      - go/foreign.go
      - go/search_keys*.go
      # Execution lifetime changes must also exercise packaged native builds.
      - go/transport*.go
      - go/aggregate.go
      - go/connection.go
      - go/rekey.go
      - python/pyproject.toml
      - python/adbc_driver_redis/**
      - scripts/build_python_wheel.py
      - scripts/verify_release_wheels.py
      - scripts/check_wheel_libraries.py
      - scripts/test_distribution.py
      - .github/workflows/publish-pypi.yml
      - .github/workflows/duckdb-extension.yml
      - .github/actions/duckdb-build-cache/**
      - duckdb-extension/**
      - CMakeLists.txt
      - extension_config.cmake
      - duckdb
      - extension-ci-tools
      - scripts/build_dbc_package.py
      - scripts/test_dbc_package.py
      - scripts/install*
      - scripts/test_install_driver.py
      - scripts/check_install_doctor.py
      - scripts/check_native_install.py
      - scripts/*partition*
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version stamped into the library and used in asset names.
  VERSION: ${{ github.event.release.tag_name || inputs.tag || 'v0.0.0-dev' }}
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
  # Go tests to skip; empty (every run but one by hand with skip) skips none.
  SKIP: ${{ inputs.skip }}
  # Pinned disposable test servers use the standard aggregate cap.
  REDIS_PARTITION_SCAN_CAP: "2147483648"

jobs:
  distribution:
    runs-on: ubuntu-24.04
    outputs:
      duckdb: ${{ steps.features.outputs.duckdb }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - id: features
        run: echo "duckdb=${{ hashFiles('duckdb-extension/redis_adbc_extension.cpp') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Test publication validation
        if: hashFiles('scripts/test_distribution.py') != ''
        run: python3 -m unittest discover -s scripts -p test_distribution.py -v

  duckdb:
    needs: distribution
    if: needs.distribution.outputs.duckdb == 'true'
    uses: ./.github/workflows/duckdb-extension.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      version: ${{ github.event.release.tag_name || inputs.tag || 'v0.0.0-dev' }}

  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # uv must trust public download hosts as well as the Redis fixture CA.
      SSL_CERT_DIR: /etc/ssl/certs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      # The build tools come from the workflow's own commit, so releases
      # tagged before it existed (rebuilt by hand) are built the same way.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: |
            go/build-linux.sh
            go/Dockerfile.linux-builder
          sparse-checkout-cone-mode: false

      - name: Identify release toolchain
        id: toolchain
        run: |
          go_version=$(awk '$1 == "go" { print $2 }' go/go.mod)
          case $go_version in *.*.*) ;; *) go_version=$go_version.0 ;; esac
          echo "go-version=$go_version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build cached AlmaLinux 8 toolchain
        uses: docker/build-push-action@v7
        env:
          # The upload job publishes every artifact as a release asset.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .workflow/go
          file: .workflow/go/Dockerfile.linux-builder
          platforms: linux/${{ matrix.arch }}
          build-args: GO_VERSION=${{ steps.toolchain.outputs.go-version }}
          tags: redis-adbc-linux-builder:local
          load: true
          cache-from: type=gha,scope=linux-builder-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-builder-${{ matrix.arch }},mode=max
      - name: Restore container Go caches
        id: container-go-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/redis-adbc-linux-go
          key: release-linux-go-v1-${{ matrix.arch }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('.workflow/go/Dockerfile.linux-builder', 'go/go.sum') }}-${{ env.REF }}
          restore-keys: |
            release-linux-go-v1-${{ matrix.arch }}-${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('.workflow/go/Dockerfile.linux-builder', 'go/go.sum') }}-
            release-linux-go-v1-${{ matrix.arch }}-${{ steps.toolchain.outputs.go-version }}-

      - name: Check cluster readiness gate
        if: hashFiles('scripts/test_cluster_ready.py') != ''
        run: python3 -m unittest discover -s scripts -p test_cluster_ready.py -v

      - name: Check management HTTP readiness retries
        if: hashFiles('scripts/test_software_bootstrap_http.py') != ''
        run: python3 -m unittest discover -s scripts -p test_software_bootstrap_http.py -v

      - name: Check dbc packaging
        if: hashFiles('scripts/test_dbc_package.py') != ''
        run: python3 -m unittest discover -s scripts -p test_dbc_package.py -v

      # Built on AlmaLinux 8 against glibc 2.28 (checked), so the library
      # loads on RHEL 8 and 9, Ubuntu 20.04 and later, and Amazon Linux 2023.
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          LINUX_BUILDER_IMAGE: redis-adbc-linux-builder:local
          LINUX_BUILD_CACHE: ${{ runner.temp }}/redis-adbc-linux-go
        run: |
          cp .workflow/go/build-linux.sh go/build-linux.sh
          ./go/build-linux.sh "$ARCH" "$VERSION"
          cp "go/build/linux-$ARCH"/* go/build/

      - name: Save container Go caches
        if: steps.container-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/redis-adbc-linux-go
          key: ${{ steps.container-go-cache.outputs.cache-primary-key }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v10.2.0

      # redis-adbc needs no cgo, so it is statically linked and runs on any
      # Linux of its architecture.
      - name: Build redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        working-directory: go
        run: |
          make adbc-cli VERSION="$VERSION"
          file build/redis-adbc
          file build/redis-adbc | grep -q 'statically linked'

      - name: Build Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          platform=manylinux_2_28_x86_64
          if [ "$ARCH" = arm64 ]; then platform=manylinux_2_28_aarch64; fi
          # Use this source ref's build requirements even when uv has cached older tools.
          python3 -c 'import pathlib, tomllib; print("\n".join(tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["build-system"]["requires"]))' > "$RUNNER_TEMP/python-build-requirements.txt"
          uv run --no-project --with build --with packaging --with-requirements "$RUNNER_TEMP/python-build-requirements.txt" python scripts/build_python_wheel.py \
            --library go/build/libadbc_driver_redis.so --platform "$platform" --version "$VERSION" --out dist
          for wheel in dist/*.whl; do sha256sum "$wheel" > "$wheel.sha256"; done

      - name: Start Redis Software
        working-directory: go
        run: make redis-up

      # -p 1: the packages' integration tests share the server, and a
      # connection opened by one rolls back the abandoned moves another set
      # up (see the Makefile's test target).
      - name: Test (Redis Software)
        working-directory: go
        env:
          # The preceding owned setup verifies noeviction through its API.
          REDIS_RETAINED_CONTROL_PERSISTENCE: guaranteed
        run: |
          go test -count=1 -p 1 -skip "$SKIP" ./...
          cd validation && uv run pytest -q -ra --junitxml=software-validation.xml tests/
          if [ -f ../../scripts/check_partition_junit.py ]; then python3 ../../scripts/check_partition_junit.py software-validation.xml; fi

      - name: Smoke test installed Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        env:
          REDIS_RETAINED_CONTROL_PERSISTENCE: guaranteed
        run: |
          uv venv --python 3.14 /tmp/redis-wheel-smoke
          uv pip install --python /tmp/redis-wheel-smoke/bin/python dist/*.whl pyarrow polars pytest
          /tmp/redis-wheel-smoke/bin/python -m pytest -q python/tests/test_driver.py
          if [ -f scripts/check_native_install.py ]; then
            /tmp/redis-wheel-smoke/bin/python scripts/check_native_install.py \
              --library go/build/libadbc_driver_redis.so --check-connection
          fi
          if [ -f scripts/check_partition_junit.py ]; then
            export REDIS_ADBC_LIBRARY="$(/tmp/redis-wheel-smoke/bin/python -c 'from adbc_driver_redis import _driver_path; print(_driver_path())')"
            cd go/validation
            uv run pytest -q -ra --junitxml=wheel-validation.xml tests/
            python3 ../../scripts/check_partition_junit.py wheel-validation.xml
          fi

      - name: Installed wheel over verified Software proxy TLS
        if: hashFiles('scripts/software_partition_tls.py') != ''
        run: |
          uv pip install --python /tmp/redis-wheel-smoke/bin/python redis
          /tmp/redis-wheel-smoke/bin/python scripts/software_partition_tls.py "$RUNNER_TEMP/software-partition-tls" \
            --container "$(docker compose -f go/compose.yaml ps -q redis-software)" \
            --api-port 19443 --db-port 6379 --shards 3
          export REDIS_TLS_ADMIN_URI="$(cat "$RUNNER_TEMP/software-partition-tls/admin.uri")"
          export SSL_CERT_FILE="$RUNNER_TEMP/software-partition-tls/ca.crt"
          if [ -f scripts/check_install_doctor.py ]; then
            REDIS_URI="$REDIS_TLS_ADMIN_URI" env -u REDIS_ADBC_LIBRARY /tmp/redis-wheel-smoke/bin/python \
              scripts/check_install_doctor.py --software-fixture "$RUNNER_TEMP/software-partition-tls" \
              --output "$RUNNER_TEMP/install-doctor-result.json"
          fi
          env -u REDIS_ADBC_LIBRARY /tmp/redis-wheel-smoke/bin/python scripts/check_partition_tls.py --require-wheel \
            --software-fixture "$RUNNER_TEMP/software-partition-tls" \
            --output "$RUNNER_TEMP/software-partition-tls-result.json"

      - name: Upload installed wheel Software TLS evidence
        if: always() && hashFiles('scripts/software_partition_tls.py') != ''
        uses: actions/upload-artifact@v7
        with:
          name: wheel-software-partition-tls-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/software-partition-tls-result.json
            ${{ runner.temp }}/install-doctor-result.json
          if-no-files-found: warn

      - name: Remove Software TLS private material
        if: always() && hashFiles('scripts/software_partition_tls.py') != ''
        run: rm -rf "$RUNNER_TEMP/software-partition-tls"

      - name: Upload native validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ matrix.arch }}
          path: go/validation/*-validation.xml
          if-no-files-found: warn

      - name: Redis diagnostics on failure
        if: failure()
        working-directory: go
        run: docker compose logs --no-color redis-software

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -f scripts/build_dbc_package.py ]; then
            python3 scripts/build_dbc_package.py --library go/build/libadbc_driver_redis.so \
              --platform "linux_$ARCH" --version "$VERSION" --out dist
          fi
          name="adbc_driver_redis-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          cp go/build/libadbc_driver_redis.so go/build/libadbc_driver_redis.h README.md "dist/$name/"
          if [ -f scripts/install.sh ]; then
            cp scripts/install.sh scripts/install_manifest.py python/adbc_driver_redis/manifest.py "dist/$name/"
            printf '%s\n' "$VERSION" > "dist/$name/VERSION"
          fi
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - name: Package redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="redis-adbc-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          cp go/build/redis-adbc README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  # The release tarball, tested on each Linux that Redis Software supports
  # (the linux job above already ran it on the Ubuntu 24.04 runner).
  platforms:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: linux
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["ubuntu:20.04", "ubuntu:22.04", "almalinux:8", "almalinux:9", "amazonlinux:2023"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Start Redis Software
        timeout-minutes: 5
        working-directory: go
        run: make redis-up

      - name: Pull validation image
        timeout-minutes: 3
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"

      - name: Validation suite
        timeout-minutes: 8
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar xzf "dist/adbc_driver_redis-$VERSION-linux-$ARCH.tar.gz" -C dist
          docker run --rm --init --name redis-release-validation --network host \
            -v "$PWD/go/validation:/src/validation:ro" \
            -v "$PWD/dist/adbc_driver_redis-$VERSION-linux-$ARCH:/lib-in:ro" \
            -v "$(dirname "$(command -v uv)"):/uv:ro" \
            -v "$PWD/go/build/test-tls:/test-tls:ro" \
            -e REDIS_URI -e SSL_CERT_FILE=/test-tls/ca.pem -e SSL_CERT_DIR=/etc/ssl/certs \
            -e REDIS_PARTITION_SCAN_CAP=2147483648 \
            -e REDIS_RETAINED_CONTROL_PERSISTENCE=guaranteed \
            -e PYTHONUNBUFFERED=1 -e UV_HTTP_TIMEOUT=60 -e UV_HTTP_RETRIES=2 \
            "$IMAGE" sh -euc '
              echo "=== Validation platform ==="
              grep PRETTY_NAME /etc/os-release
              ldd --version | head -1
              echo "=== Installing system prerequisites ==="
              if command -v apt-get >/dev/null; then
                apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
                DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y git ca-certificates
              else
                # AlmaLinux mirrors can trickle metadata for the entire step
                # budget. Reject slow transfers so DNF tries another mirror.
                dnf --setopt=timeout=30 --setopt=minrate=1M --setopt=retries=2 -y install git ca-certificates
              fi
              echo "=== Preparing validation fixtures ==="
              mkdir -p /work/go/build
              cp -r /src/validation /work/go/
              cp /lib-in/libadbc_driver_redis.so /work/go/build/
              cd /work/go/validation
              echo "=== Resolving Python and validation dependencies ==="
              /uv/uv sync --no-progress
              echo "=== Running validation tests ==="
              /uv/uv run --no-sync python -u -m pytest -vv -o faulthandler_timeout=60 tests/'

      - name: Validation diagnostics on failure
        if: failure()
        timeout-minutes: 1
        working-directory: go
        run: |
          docker ps -a
          if docker inspect redis-release-validation >/dev/null 2>&1; then
            docker logs --tail 200 redis-release-validation
            docker top redis-release-validation
          fi
          docker compose logs --no-color --tail 100

      - name: Stop validation container
        if: always()
        timeout-minutes: 1
        run: |
          if docker inspect redis-release-validation >/dev/null 2>&1; then
            docker rm -f redis-release-validation
          fi

      # The redis-adbc tarball: an application's HASHes (written with the
      # server's redis-cli), checked, copied into a table, and adopted.
      - name: redis-adbc
        timeout-minutes: 3
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="redis-adbc-$VERSION-linux-$ARCH"
          tar xzf "dist/$name.tar.gz" -C dist
          (cd go && docker compose exec -T -e REDISCLI_AUTH=adbc-enterprise-test redis-software /opt/redislabs/bin/redis-cli --tls --cacert /tmp/adbc-test-ca.pem --user default -p 12000 HSET release:adbc:1 name a n 1 >/dev/null &&
            docker compose exec -T -e REDISCLI_AUTH=adbc-enterprise-test redis-software /opt/redislabs/bin/redis-cli --tls --cacert /tmp/adbc-test-ca.pem --user default -p 12000 HSET release:adbc:2 name b n 2 >/dev/null)
          docker run --rm --network host \
            -v "$PWD/dist/$name:/cli:ro" \
            -v "$PWD/go/build/test-tls:/test-tls:ro" \
            -e REDIS_URI -e SSL_CERT_FILE=/test-tls/ca.pem "$IMAGE" sh -euc '
              cd /tmp
              /cli/redis-adbc check -prefix release:adbc: > out
              grep -qx "SQL, copied into a driver table (redis-adbc copy): READY" out
              grep -qx "SQL, adopted in place (redis-adbc adopt): READY" out
              /cli/redis-adbc copy -prefix release:adbc: -table release_adbc_copy -mode replace > out
              grep -qx "2 rows copied into public.release_adbc_copy" out
              /cli/redis-adbc adopt -prefix release:adbc: -table release_adbc -apply > out
              grep -q "^Adopted: public.release_adbc now reads the HASHes under release:adbc:" out'

  # macOS uses a native Homebrew Redis/Search fixture instead of Docker.
  # New source refs require Go integration and installed-wheel validation;
  # older tags lacking the fixture helper retain their original load checks.
  macos:
    name: darwin-arm64
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        working-directory: go
        run: make build VERSION="$VERSION"

      - name: Build and load Python wheel
        if: hashFiles('python/pyproject.toml') != ''
        run: |
          # Use this source ref's build requirements even when uv has cached older tools.
          python3 -c 'import pathlib, tomllib; print("\n".join(tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["build-system"]["requires"]))' > "$RUNNER_TEMP/python-build-requirements.txt"
          uv run --no-project --with build --with packaging --with-requirements "$RUNNER_TEMP/python-build-requirements.txt" python scripts/build_python_wheel.py \
            --library go/build/libadbc_driver_redis.dylib --platform macosx_12_0_arm64 --version "$VERSION" --out dist
          for wheel in dist/*.whl; do shasum -a 256 "$wheel" > "$wheel.sha256"; done
          uv venv --python 3.14 /tmp/redis-wheel-smoke
          uv pip install --python /tmp/redis-wheel-smoke/bin/python dist/*.whl
          /tmp/redis-wheel-smoke/bin/python -c "import ctypes; from adbc_driver_redis import _driver_path; ctypes.CDLL(_driver_path()).AdbcDriverInit"
          if [ -f scripts/check_native_install.py ]; then
            python3 scripts/check_native_install.py --library go/build/libadbc_driver_redis.dylib
          fi

      - name: Start authenticated TLS native macOS Redis with Search
        if: hashFiles('scripts/native_partition_redis.py') != ''
        run: |
          brew update
          env -u HOMEBREW_NO_INSTALL_UPGRADE brew install redis
          prefix="$(brew --prefix redis)"
          brew info --json=v2 redis > "$RUNNER_TEMP/redis-homebrew.json"
          bash scripts/build_native_redis_fixture.sh "$RUNNER_TEMP/redis-fixture-source" \
            "$(brew --prefix openssl@4)" "$RUNNER_TEMP/redis-homebrew.json"
          fixture_bin="$(find "$RUNNER_TEMP/redis-fixture-source" -path '*/src/redis-server' -type f -print -quit)"
          fixture_bin="$(dirname "$fixture_bin")"
          python3 scripts/native_partition_redis.py start "$RUNNER_TEMP/native-partition-redis" --tls \
            --server "$fixture_bin/redis-server" --cli "$fixture_bin/redis-cli" \
            --module "$prefix/lib/redis/modules/redisearch.so" --port 16391
          cp "$RUNNER_TEMP/redis-homebrew.json" "$RUNNER_TEMP/native-partition-redis/homebrew.json"
          fixture="$RUNNER_TEMP/native-partition-redis/tls"
          REDISCLI_AUTH="$(cat "$fixture/admin.password")" "$fixture_bin/redis-cli" \
            --tls --cacert "$fixture/ca.crt" --user default -p 16391 \
            -e CONFIG SET search-max-aggregate-results 2147483648 loglevel verbose
          # uv reads every PEM in SSL_CERT_DIR alongside the private fixture CA.
          mkdir -p "$RUNNER_TEMP/public-ca-roots"
          cp /etc/ssl/cert.pem "$RUNNER_TEMP/public-ca-roots/system.pem"
          python3 - "$fixture" >> "$GITHUB_ENV" <<'PY'
          import pathlib, sys
          fixture = pathlib.Path(sys.argv[1])
          print('REDIS_URI=' + (fixture / 'admin.uri').read_text().strip())
          print('SSL_CERT_FILE=' + str(fixture / 'ca.crt'))
          PY
          echo "SSL_CERT_DIR=$RUNNER_TEMP/public-ca-roots" >> "$GITHUB_ENV"

      - name: Build redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        working-directory: go
        run: |
          make adbc-cli VERSION="$VERSION"
          file build/redis-adbc | grep -q arm64
          build/redis-adbc help | grep -q adopt

      - name: Test native wide fetch
        if: hashFiles('go/wide_fetch_integration_test.go') != ''
        working-directory: go
        run: env -u REDIS_PARTITION_SCAN_CAP REDIS_PARTITION_CAP_TEST=1 go test -count=1 -p 1 -run '^TestSQLWideHashFetchBothAPIs$' -v .

      - name: Test
        working-directory: go
        run: |
          env -u REDIS_PARTITION_SCAN_CAP REDIS_PARTITION_CAP_TEST=1 go test -count=1 -p 1 -skip "$SKIP" ./...
          file build/libadbc_driver_redis.dylib | grep -q arm64
          python3 -c "import ctypes; ctypes.CDLL('build/libadbc_driver_redis.dylib').AdbcDriverInit"

      - name: Full macOS installed-wheel ADBC validation at real cap 137
        if: hashFiles('scripts/native_partition_redis.py') != ''
        env:
          REDIS_PARTITION_SCAN_CAP: '137'
        run: |
          fixture="$RUNNER_TEMP/native-partition-redis/tls"
          REDISCLI_AUTH="$(cat "$fixture/admin.password")" "$(brew --prefix redis)/bin/redis-cli" \
            --tls --cacert "$fixture/ca.crt" --user default -p 16391 \
            -e CONFIG SET search-max-aggregate-results 137
          export REDIS_ADBC_LIBRARY="$(/tmp/redis-wheel-smoke/bin/python -c 'from adbc_driver_redis import _driver_path; print(_driver_path())')"
          cd go/validation
          uv run pytest -q -ra --junitxml=macos-wheel-validation.xml tests/
          python3 ../../scripts/check_partition_junit.py macos-wheel-validation.xml

      - name: Minimum supported ADBC client on the installed macOS wheel
        if: hashFiles('scripts/native_partition_redis.py') != ''
        env:
          REDIS_PARTITION_SCAN_CAP: '137'
        run: |
          export REDIS_ADBC_LIBRARY="$(/tmp/redis-wheel-smoke/bin/python -c 'from adbc_driver_redis import _driver_path; print(_driver_path())')"
          cd go/validation
          uv run --with adbc-driver-manager==1.12.0 pytest -q -ra --junitxml=macos-minimum-client-validation.xml tests/test_partitions.py tests/test_partitions_retained.py
          python3 ../../scripts/check_partition_junit.py macos-minimum-client-validation.xml

      - name: Verified TLS on the installed macOS wheel
        if: hashFiles('scripts/create_partition_tls.sh') != ''
        run: |
          prefix="$(brew --prefix redis)"
          python3 scripts/native_partition_redis.py start "$RUNNER_TEMP/native-partition-tls" --tls \
            --server "$prefix/bin/redis-server" --cli "$prefix/bin/redis-cli" \
            --module "$prefix/lib/redis/modules/redisearch.so" --port 16392
          uv pip install --python /tmp/redis-wheel-smoke/bin/python pyarrow redis
          export REDIS_TLS_ADMIN_URI="$(cat "$RUNNER_TEMP/native-partition-tls/tls/admin.uri")"
          export SSL_CERT_FILE="$RUNNER_TEMP/native-partition-tls/tls/ca.crt"
          env -u REDIS_ADBC_LIBRARY /tmp/redis-wheel-smoke/bin/python scripts/check_partition_tls.py --require-wheel \
            --output "$RUNNER_TEMP/macos-partition-tls-result.json"
          # The private fixture CA must not replace PyPI's public trust roots.
          env -u SSL_CERT_FILE uv pip install --python /tmp/redis-wheel-smoke/bin/python 'adbc-driver-manager==1.12.0'
          env -u REDIS_ADBC_LIBRARY /tmp/redis-wheel-smoke/bin/python scripts/check_partition_tls.py --require-wheel \
            --output "$RUNNER_TEMP/macos-partition-tls-minimum-client.json"

      - name: Native macOS Redis diagnostics on failure
        if: failure() && hashFiles('scripts/native_partition_redis.py') != ''
        run: |
          python3 - "$RUNNER_TEMP/native-partition-redis" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          log = root / 'redis.log'
          if log.exists():
              text = log.read_text(errors='replace')
              for name in ('admin.password', 'admin.uri'):
                  path = root / 'tls' / name
                  if path.exists() and (secret := path.read_text().strip()):
                      text = text.replace(secret, '[redacted]')
              lines = text.splitlines()
              print('Redis startup:')
              print('\n'.join(lines[:25]))
              print('Redis warnings and connection errors:')
              print('\n'.join(line for line in lines if ' # ' in line or any(
                  marker in line.lower() for marker in ('error', 'closing', 'maxclients', 'protocol error')
              )))
              print('Redis final activity:')
              print('\n'.join(lines[-100:]))
          PY

      - name: Upload macOS native partition evidence
        if: always() && hashFiles('scripts/native_partition_redis.py') != ''
        uses: actions/upload-artifact@v7
        with:
          name: macos-partition-validation
          path: |
            go/validation/macos-*-validation.xml
            ${{ runner.temp }}/macos-partition-tls-*.json
            ${{ runner.temp }}/native-partition-redis/*.info
            ${{ runner.temp }}/native-partition-redis/*.txt
            ${{ runner.temp }}/native-partition-redis/*.log
            ${{ runner.temp }}/native-partition-redis/homebrew.json
          if-no-files-found: warn

      - name: Stop owned native macOS Redis
        if: always() && hashFiles('scripts/native_partition_redis.py') != ''
        timeout-minutes: 1
        run: |
          python3 scripts/native_partition_redis.py stop "$RUNNER_TEMP/native-partition-redis"
          rm -rf "$RUNNER_TEMP/native-partition-redis/tls"

      - name: Stop owned native macOS TLS Redis
        if: always() && hashFiles('scripts/create_partition_tls.sh') != ''
        timeout-minutes: 1
        run: |
          python3 scripts/native_partition_redis.py stop "$RUNNER_TEMP/native-partition-tls"
          rm -rf "$RUNNER_TEMP/native-partition-tls/tls"
          rm -f "$RUNNER_TEMP/native-partition-tls/tls-redis.conf" "$RUNNER_TEMP/native-partition-tls/uri"

      - name: Package
        run: |
          if [ -f scripts/build_dbc_package.py ]; then
            python3 scripts/build_dbc_package.py --library go/build/libadbc_driver_redis.dylib \
              --platform macos_arm64 --version "$VERSION" --out dist
          fi
          name="adbc_driver_redis-$VERSION-darwin-arm64"
          mkdir -p "dist/$name"
          cp go/build/libadbc_driver_redis.dylib go/build/libadbc_driver_redis.h README.md "dist/$name/"
          if [ -f scripts/install.sh ]; then
            cp scripts/install.sh scripts/install_manifest.py python/adbc_driver_redis/manifest.py "dist/$name/"
            printf '%s\n' "$VERSION" > "dist/$name/VERSION"
          fi
          cd dist
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - name: Package redis-adbc
        if: hashFiles('go/cmd/redis-adbc/main.go') != ''
        run: |
          name="redis-adbc-$VERSION-darwin-arm64"
          mkdir -p "dist/$name"
          cp go/build/redis-adbc README.md "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: dist/

  # Reuse the native release wheels rather than rebuilding for each client.
  # This is a partition/TLS gate; the parent jobs retain full upstream suites.
  wheel-clients:
    name: wheel-${{ matrix.artifact }}-py${{ matrix.python }}-adbc${{ matrix.manager }}
    needs: [linux, macos]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        artifact: [linux-amd64, linux-arm64, darwin-arm64]
        python: ['3.14']
        manager: ['1.12.0']
        include:
          - artifact: linux-amd64
            runner: ubuntu-24.04
          - artifact: linux-arm64
            runner: ubuntu-24.04-arm
          - artifact: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Detect partition checker at the selected release ref
        id: capability
        run: |
          # Historical releases without this checker keep their existing gates.
          if [ -f scripts/check_partition_tls.py ] && [ -f scripts/native_partition_redis.py ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.capability.outputs.enabled == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.capability.outputs.enabled == 'true'
      - name: Install the packaged wheel and selected client
        if: steps.capability.outputs.enabled == 'true'
        env:
          CLIENT_PYTHON: ${{ matrix.python }}
          ADBC_MANAGER: ${{ matrix.manager }}
        run: |
          uv venv --python "$CLIENT_PYTHON" "$RUNNER_TEMP/wheel-client"
          uv pip install --python "$RUNNER_TEMP/wheel-client/bin/python" \
            dist/*.whl "adbc-driver-manager==$ADBC_MANAGER" pyarrow redis
      - name: Start owned Linux TLS fixture
        if: steps.capability.outputs.enabled == 'true' && runner.os == 'Linux'
        run: bash scripts/start_partition_tls.sh "$RUNNER_TEMP/wheel-client-tls" redis-wheel-client-tls 16390
      - name: Start owned macOS TLS fixture
        if: steps.capability.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          brew update
          env -u HOMEBREW_NO_INSTALL_UPGRADE brew install redis
          prefix="$(brew --prefix redis)"
          python3 scripts/native_partition_redis.py start "$RUNNER_TEMP/wheel-client-native" --tls \
            --server "$prefix/bin/redis-server" --cli "$prefix/bin/redis-cli" \
            --module "$prefix/lib/redis/modules/redisearch.so" --port 16390
      - name: Verify independent partitions from the installed wheel
        if: steps.capability.outputs.enabled == 'true'
        env:
          CLIENT_ARTIFACT: ${{ matrix.artifact }}
          CLIENT_PYTHON: ${{ matrix.python }}
          ADBC_MANAGER: ${{ matrix.manager }}
        run: |
          fixture="$RUNNER_TEMP/wheel-client-tls"
          if [ "$RUNNER_OS" = macOS ]; then fixture="$RUNNER_TEMP/wheel-client-native/tls"; fi
          export REDIS_TLS_ADMIN_URI="$(cat "$fixture/admin.uri")"
          export SSL_CERT_FILE="$fixture/ca.crt"
          env -u REDIS_ADBC_LIBRARY "$RUNNER_TEMP/wheel-client/bin/python" scripts/check_partition_tls.py \
            --require-wheel --output "$RUNNER_TEMP/wheel-client-$CLIENT_ARTIFACT-py$CLIENT_PYTHON-adbc$ADBC_MANAGER.json"
      - name: Upload wheel client evidence
        if: always() && steps.capability.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wheel-client-${{ matrix.artifact }}-py${{ matrix.python }}-adbc${{ matrix.manager }}
          path: ${{ runner.temp }}/wheel-client-*.json
          if-no-files-found: warn
      - name: Remove owned Linux TLS fixture
        if: always() && steps.capability.outputs.enabled == 'true' && runner.os == 'Linux'
        run: |
          if docker container inspect redis-wheel-client-tls >/dev/null 2>&1; then docker rm -f redis-wheel-client-tls; fi
          rm -rf "$RUNNER_TEMP/wheel-client-tls"
      - name: Stop owned macOS TLS fixture and remove private material
        if: always() && steps.capability.outputs.enabled == 'true' && runner.os == 'macOS'
        run: |
          python3 scripts/native_partition_redis.py stop "$RUNNER_TEMP/wheel-client-native"
          rm -rf "$RUNNER_TEMP/wheel-client-native"

  upload:
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.distribution.result == 'success' && needs.linux.result == 'success' &&
      needs.platforms.result == 'success' && needs.macos.result == 'success' &&
      needs.wheel-clients.result == 'success' &&
      (needs.duckdb.result == 'success' || needs.duckdb.result == 'skipped')
    needs: [distribution, linux, platforms, macos, wheel-clients, duckdb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.duckdb.result == 'success'
        with:
          pattern: duckdb-*
          path: dist
          merge-multiple: true
      - name: Package managed native installer
        run: |
          cp scripts/install_driver.py dist/
          (cd dist && sha256sum install_driver.py > install_driver.py.sha256)
      - name: Generate Redis dbc registry entry
        run: |
          if compgen -G 'dist/redis_*.tar.gz' > /dev/null; then
            python3 scripts/build_dbc_package.py --index-only --version "$VERSION" --out dist
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Record completed release for automatic PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p metadata
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY"             --json tagName,isDraft,isPrerelease > metadata/release-metadata.json
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('metadata/release-metadata.json')
          release = json.loads(path.read_text())
          release['tag'] = os.environ['VERSION']
          release['skip'] = os.environ.get('SKIP', '')
          path.write_text(json.dumps(release))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: metadata/release-metadata.json
          if-no-files-found: error
